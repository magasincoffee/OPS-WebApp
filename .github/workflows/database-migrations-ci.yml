name: Database Migrations CI

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/database-migrations-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/database-migrations-ci.yml"

permissions:
  contents: read

jobs:
  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3

      - name: Initialize local Supabase config
        run: supabase init

      - name: Apply all migrations to a fresh local database
        run: supabase db start
