name: Public Repository Scrub

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public repository current tree and full Git history
        run: python scripts/public_repo_scrub.py --history
